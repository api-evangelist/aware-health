aid: aware-health
name: Aware Health
description: >-
  Aware Health is an AI-powered musculoskeletal (MSK) care platform that helps
  employers, health plans, and brokers reduce MSK spend while preventing
  orthopedic surgeries and chronic pain. The company pairs licensed clinicians
  (physical therapists and health coaches) with an AI "Predict" engine to
  triage, navigate, and manage musculoskeletal conditions virtually, and reports
  reducing MSK costs by roughly 30%. Its platform spans MSK care, chronic care,
  surgery decision support, member navigation, analytics, and an employer
  dashboard, delivered via web and an iOS app. Aware Health is a Techstars
  portfolio company and has raised seed funding (including a $3M round led by
  Boomerang VC with Bright Ventures). This profile was enriched from the
  company's public web surface; Aware Health does not currently publish a public
  developer API, SDKs, or API documentation.
